server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, matrics

  endpoint:
    health:
      show-details: always

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Consumers in other services use their own event classes.
        # Type headers would embed this service's FQCN and break deserialization.
        spring.json.add.type.headers: false

logging:
  level:
    com.example.userservice: INFO
    org.springframework.kafka: INFO
